<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — PNRD</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Work Sans', Arial, sans-serif;
      background: #faf7f1;
      color: #201a14;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 560px;
    }

    .code {
      font-family: 'Archivo', sans-serif;
      font-size: 7rem;
      font-weight: 900;
      color: #0b2545;
      line-height: 1;
      letter-spacing: -4px;
    }

    .code span {
      color: #cf9a3e;
    }

    .divider {
      width: 60px;
      height: 4px;
      background: linear-gradient(to right, transparent, #cf9a3e, transparent);
      border-radius: 2px;
      margin: 24px auto;
    }

    h1 {
      font-family: 'Archivo', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #0b2545;
      margin-bottom: 14px;
    }

    p {
      font-size: 1.05rem;
      color: #5b5548;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0b2545;
      color: #fff;
      text-decoration: none;
      padding: 13px 32px;
      border-radius: 30px;
      font-family: 'Archivo', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      transition: background 0.25s ease, transform 0.2s ease;
    }

    .btn-home:hover {
      background: #7a1e33;
      transform: translateY(-2px);
    }

    .btn-home:focus-visible {
      outline: 2px solid #cf9a3e;
      outline-offset: 3px;
    }

    .logo-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.1rem;
      font-weight: 600;
      color: #7a1e33;
      margin-bottom: 32px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .logo-text span { color: #cf9a3e; }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo-text">PN<span>RD</span></div>
    <div class="code">4<span>0</span>4</div>
    <div class="divider"></div>
    <h1>Page introuvable</h1>
    <p>
      La page que vous recherchez n'existe pas ou a été déplacée.<br />
      Revenez à l'accueil pour continuer votre navigation.
    </p>
    <a href="index.html" class="btn-home">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" style="width:1.1em;height:1.1em;vertical-align:-0.15em;">
        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
      Retour à l'accueil
    </a>
  </div>
</body>

</html>
