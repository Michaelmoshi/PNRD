<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — PNRD</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 560px;
    }

    .code {
      font-size: 7rem;
      font-weight: 900;
      color: #00529b;
      line-height: 1;
      letter-spacing: -4px;
    }

    .code span {
      color: #4caf50;
    }

    .divider {
      width: 60px;
      height: 4px;
      background: linear-gradient(to right, #00529b, #4caf50);
      border-radius: 2px;
      margin: 20px auto;
    }

    h1 {
      font-size: 1.6rem;
      color: #00529b;
      margin-bottom: 14px;
    }

    p {
      font-size: 1.05rem;
      color: #555;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #00529b;
      color: #fff;
      text-decoration: none;
      padding: 13px 32px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.25s ease, transform 0.2s ease;
    }

    .btn-home:hover {
      background: #4caf50;
      transform: translateY(-2px);
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: 800;
      color: #00529b;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }

    .logo-text span { color: #4caf50; }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo-text">PN<span>RD</span></div>
    <div class="code">4<span>0</span>4</div>
    <div class="divider"></div>
    <h1>Page introuvable</h1>
    <p>
      La page que vous recherchez n'existe pas ou a été déplacée.<br />
      Revenez à l'accueil pour continuer votre navigation.
    </p>
    <a href="index.html" class="btn-home">
      <i class="fas fa-home"></i> Retour à l'accueil
    </a>
  </div>
</body>

</html>
